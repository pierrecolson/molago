# Molago sur le VPS Hostinger (srv1405219).
#
# Deux pièces : les fichiers déjà importés et l'API qui reçoit les nouveaux.
# Aucune fabrique nocturne et aucune base de données.
#
#   déploiement    : ../deploy/push.sh
# ATTENTION — cette machine n'a que 8 Go et fait tourner n8n, to-day, thiings,
# ourmind et dawarich côte à côte. Tout conteneur porte donc un plafond mémoire
# explicite : le but n'est pas d'économiser, c'est qu'un emballement ne
# déclenche pas l'OOM killer et n'emporte pas les voisins.

services:
  # Le serveur de fichiers. Il sert les imports déjà enregistrés.
  files:
    image: nginx:1.27-alpine
    container_name: molago-files
    restart: unless-stopped
    # nginx au repos tient dans quelques mégaoctets ; il ne sert que des
    # fichiers statiques, il n'a aucune raison de grossir.
    mem_limit: 64m
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.molago.rule=Host(`molago.srv1405219.hstgr.cloud`)
      - traefik.http.routers.molago.entrypoints=websecure
      - traefik.http.routers.molago.tls=true
      - traefik.http.routers.molago.tls.certresolver=mytlschallenge
      - traefik.http.services.molago.loadbalancer.server.port=80

  # L'API reçoit les photos et vidéos choisies par l'utilisateur.
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: molago-api:local
    container_name: molago-api
    restart: unless-stopped
    # Node et yt-dlp restent sous un plafond explicite sur le VPS partagé.
    mem_limit: 256m
    env_file: .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - ./data:/data
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      # Même hôte que les fichiers, distingué par le préfixe de chemin. Une
      # priorité plus haute que la route des fichiers, sinon nginx capterait
      # tout et l'API ne verrait jamais rien.
      - traefik.http.routers.molago-api.rule=Host(`molago.srv1405219.hstgr.cloud`) && PathRegexp(`^/u/[^/]+/(gloss|captures|document|youtube|library)$`)
      - traefik.http.routers.molago-api.priority=100
      - traefik.http.routers.molago-api.entrypoints=websecure
      - traefik.http.routers.molago-api.tls=true
      - traefik.http.routers.molago-api.tls.certresolver=mytlschallenge
      - traefik.http.services.molago-api.loadbalancer.server.port=8080

networks:
  n8n_default:
    external: true
