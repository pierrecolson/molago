# Le contenu du jour est servi sous un chemin secret plutôt que derrière une
# authentification : il n'y a qu'un utilisateur, et Google OAuth n'arrive
# qu'avec l'inscription publique (mvp-plan.md §1). Le chemin est un jeton
# aléatoire, la racine ne révèle rien, et tout passe en HTTPS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Rien à la racine : qui tombe là ne doit rien apprendre.
    location = / { return 404; }
    location = /index.html { return 404; }

    # Pas d'index de répertoire : le jeton ne protège rien si on peut lister.
    autoindex off;

    location / {
        try_files $uri =404;

        # Le JSON du jour change chaque nuit, les pistes audio jamais — leur nom
        # porte la date. On les met donc en cache long côté téléphone, et le
        # JSON reste frais.
        location ~* \.mp3$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.json$ {
            add_header Cache-Control "no-cache";
        }
    }

    # Ni version ni modules dans les en-têtes.
    server_tokens off;

    access_log off;
    error_log /var/log/nginx/error.log warn;
}
