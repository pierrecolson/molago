# Le projet Xcode est décrit ici et régénéré par `xcodegen`. Le .xcodeproj
# n'est pas versionné : c'est un fichier bineux dont les diffs sont illisibles
# et qui entre en conflit dès qu'on y touche à deux endroits. Ce YAML, lui, se
# lit et se relit.
#
#   cd app && xcodegen && open Molago.xcodeproj

name: Molago
packages:
  YouTubeMetadata:
    url: https://github.com/arraypress/swift-youtube-metadata.git
    exactVersion: 0.1.0
options:
  bundleIdPrefix: com.pierrecolson
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Compte développeur payant (équipe « Pierre Nicolas COLSON »). C'est ce
    # numéro, et pas l'équipe personnelle gratuite, qui donne un profil valable
    # un an au lieu de sept jours — l'app installée sur l'iPhone reste donc
    # utilisable au quotidien. L'équipe est nommée explicitement pour que la
    # construction en ligne de commande se signe seule, sans ouvrir Xcode.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7R46U8G25A
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Écrit en toutes lettres plutôt que dérivé du nom de la cible. Le premier
    # build s'était signé avec l'équipe personnelle gratuite, qui a enregistré
    # « com.pierrecolson.Molago » chez Apple — et un identifiant d'app ne
    # revient jamais à une autre équipe, majuscule ou pas : le compte payant
    # s'est vu refuser « com.pierrecolson.molago » pour cause de collision.
    # D'où ce nom-ci, enregistré au compte payant et utilisable sur TestFlight.
    PRODUCT_BUNDLE_IDENTIFIER: com.molago.app
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Le numéro affiché aux testeurs, et le numéro de build qu'App Store Connect
    # exige unique à chaque envoi. Bougés ici, ils suivent partout.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Molago:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: YouTubeMetadata
        product: YouTubeTranscript
    entitlements:
      path: Sources/Molago.entitlements
      properties:
        # Les documents iCloud, pas CloudKit : ce qu'on synchronise est un
        # fichier — la photo d'une capture — et le stockage de documents fait
        # exactement ça sans base de données, sans schéma, et sans code de
        # synchronisation à écrire. Les fichiers déposés dans le conteneur
        # remontent et redescendent seuls.
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.molago.app
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.molago.app
    settings:
      base:
        # iPhone seul. Par défaut la cible vise aussi l'iPad, et l'App Store
        # refuse alors une app en portrait strict : le multitâche iPad impose
        # les quatre orientations. Molago se tient d'une main, dans le métro —
        # c'est un téléphone. (Il tourne sur iPad, en mode compatibilité.)
        #
        # À écrire ici et pas dans les réglages généraux du projet : xcodegen
        # pose « 1,2 » sur la cible elle-même, et ce qui est posé sur la cible
        # l'emporte. Le même réglage plus haut est purement décoratif.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Molago
        # Branchés sur les réglages plutôt qu'écrits en dur : sans ça, xcodegen
        # fige « 1 » dans le plist et le numéro de build passé à la construction
        # est ignoré — App Store Connect refuse alors le deuxième envoi.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Molago ne chiffre rien de son cru (HTTPS seul, exempté). Répondu ici
        # une fois pour toutes, sinon App Store Connect repose la question à
        # chaque envoi et bloque la distribution aux testeurs en attendant.
        ITSAppUsesNonExemptEncryption: false
        # Sans cette déclaration, le conteneur existe mais reste invisible dans
        # l'app Fichiers et dans les réglages iCloud : l'utilisateur ne peut ni
        # voir ce qui est stocké, ni le supprimer.
        NSUbiquitousContainers:
          iCloud.com.molago.app:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Molago
            NSUbiquitousContainerSupportedFolderLevels: Any
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # La voix continue quand l'écran s'éteint : on lit dans le métro,
        # téléphone en poche.
        UIBackgroundModes:
          - audio
        # Demandée seulement en M4, à la capture. Déclarée ici pour que la
        # chaîne de signature soit déjà en place.
        NSCameraUsageDescription: >
          Molago lit les mots coréens que vous photographiez — une facture, un
          panneau, un menu — pour les ajouter à votre carnet.
        NSPhotoLibraryUsageDescription: >
          Choisissez une photo ou une capture d'écran contenant du coréen, et
          Molago vous dira ce que chaque mot veut dire.

  MolagoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Molago
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.molago.app.tests
        GENERATE_INFOPLIST_FILE: YES
